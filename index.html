
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CriaLead | O CRM #1 Para Agências Digitais</title>
    <meta name="description" content="Gerencie leads, pipeline e orçamentos em uma plataforma moderna feita para agências digitais. Comece grátis hoje." />
    
    <!-- Open Graph -->
    <meta property="og:title" content="CriaLead – O CRM #1 Para Agências Digitais" />
    <meta property="og:description" content="Pare de perder leads em planilhas. Gerencie clientes, pipeline e orçamentos em uma plataforma moderna." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=1200" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            colors: {
              brand: {
                dark: '#050505',
                navy: '#0A0A0B',
                accent: '#94A3B8', /* Cinza Platina/Slate — cor principal do menu */
                silver: '#CBD5E1',
                emerald: '#10B981',
                slate: '#94A3B8',
                whatsapp: '#25D366'
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 5s ease-in-out infinite',
              'fade-in': 'fadeIn 0.4s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateX(20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body { 
        background-color: #050505;
        color: #ffffff;
      }
      section[id] {
        scroll-margin-top: 110px;
      }
      .glass-card { 
        background: rgba(255, 255, 255, 0.02); 
        backdrop-filter: blur(12px); 
        border: 1px solid rgba(255, 255, 255, 0.05); 
      }
      .text-balance { text-wrap: balance; }
      ::selection { background: #94A3B8; color: #050505; }

      /* Animação de entrada para alertas */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateX(20px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Scrollbar sutil */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }

      /* Estilo do select no CRM */
      select option {
        background-color: #0A0A0B;
        color: #ffffff;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4"
      }
    }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
